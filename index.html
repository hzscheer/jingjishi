<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>中级经济师备考工作台</title>
<link rel="stylesheet" href="css/style.css">

  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="经济师备考">
  <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn back-btn" id="btnBack" style="display:none">&#x2190;</button>
      <h1 class="app-title" id="headerTitle">备考工作台</h1>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="btnSettings">&#x2699;</button>
    </div>
  </header>
  <div class="tab-bar" id="tabBar">
    <div class="tab-item active" data-tab="home"><span class="tab-icon">&#x2302;</span><span>首页</span></div>
    <div class="tab-item" data-tab="stage1"><span class="tab-icon">&#x1F4DA;</span><span>考点</span></div>
    <div class="tab-item" data-tab="stage2"><span class="tab-icon">&#x270F;</span><span>母题</span></div>
    <div class="tab-item" data-tab="stage3"><span class="tab-icon">&#x1F3AF;</span><span>真题</span></div>
    <div class="tab-item" data-tab="wrong"><span class="tab-icon">&#x274C;</span><span>错题</span></div>
  </div>
  <main class="main-content" id="mainContent"></main>
  <div class="bottom-nav">
    <div class="nav-item active" data-nav="home"><span class="nav-icon">&#x1F3E0;</span><span>首页</span></div>
    <div class="nav-item" data-nav="formula"><span class="nav-icon">&#x1F4D6;</span><span>口诀公式</span></div>
    <div class="nav-item" data-nav="random"><span class="nav-icon">&#x1F3B2;</span><span>随机组题</span></div>
    <div class="nav-item" data-nav="checkin"><span class="nav-icon">&#x1F4C5;</span><span>打卡</span></div>
    <div class="nav-item" data-nav="me"><span class="nav-icon">&#x1F464;</span><span>我的</span></div>
  </div>
  <div id="modalOverlay" class="modal-overlay" style="display:none"></div>
  <div id="modalContent" class="modal-content" style="display:none"></div>
  <div id="toast" class="toast" style="display:none"></div>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
